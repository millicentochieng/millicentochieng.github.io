    <meta property="og:title" content="News · Millicent Ochieng" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0f5d56" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%8D</text></svg>" />

    <link rel="stylesheet" href="../css/tokens.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main>
      <div class="wrap page-head">
        <p class="eyebrow">Latest</p>
        <h1>News</h1>
        <p class="lede">Papers, awards, fellowships and community work.</p>
      </div>
      <div class="wrap page-body">
        <ul class="timeline" id="news"></ul>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="../js/site.js"></script>
    <script>
      fetch("../data/news.json")
        .then((r) => r.json())
        .then((items) => {
          document.getElementById("news").innerHTML = items
            .map((n) => `<li class="tl"><div class="d">${n.date}</div><p>${n.text}</p></li>`)
            .join("");
        });
    </script>
  </body>
