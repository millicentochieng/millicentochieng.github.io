<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publications — Millicent Ochieng</title>
    <meta name="description" content="Peer-reviewed publications by Millicent Ochieng at EMNLP, NAACL, LREC, ACL and AfriCHI on multilingual and multicultural AI." />
    <meta name="author" content="Millicent Ochieng" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Publications — Millicent Ochieng" />
    <meta property="og:description" content="Peer-reviewed publications by Millicent Ochieng at EMNLP, NAACL, LREC, ACL and AfriCHI on multilingual and multicultural AI." />
    <meta property="og:image" content="https://millicentochieng.github.io/src/assets/og-card.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Publications — Millicent Ochieng" />
    <meta name="twitter:description" content="Peer-reviewed publications by Millicent Ochieng at EMNLP, NAACL, LREC, ACL and AfriCHI on multilingual and multicultural AI." />
    <meta name="twitter:image" content="https://millicentochieng.github.io/src/assets/og-card.jpg" />
    <meta name="theme-color" content="#0f5d56" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%8D</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tokens.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main>
      <div class="wrap page-head">
        <p class="eyebrow">Peer-reviewed work</p>
        <h1>Publications</h1>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.4rem" id="filters"></div>
      </div>
      <div class="wrap page-body">
        <p class="eyebrow mono" id="count"></p>
        <ul class="pubs" id="pubs"></ul>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="../js/site.js"></script>
    <script>
      fetch("../data/publications.json")
        .then((r) => r.json())
        .then((all) => {
          const list = document.getElementById("pubs");
          const filters = document.getElementById("filters");
          const venues = ["All", ...new Set(all.map((p) => p.venue))];
          let active = "All";

          const ME = /Ochieng$/;
          const esc = (t) =>
            String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
          const name = (a) => (ME.test(a) ? `<b>${esc(a)}</b>` : esc(a));

          const attr = (t) => esc(t).replace(/"/g, "&quot;");

          function authorHTML(authors) {
            const full = authors.map(name).join(", ");
            if (authors.length <= 4) return full;
            const meIdx = authors.findIndex((a) => ME.test(a));
            let shown = authors.slice(0, 3).map(name).join(", ");
            let hidden = authors.length - 3;
            if (meIdx > 2) {
              shown += `, &hellip;, ${name(authors[meIdx])}`;
              hidden -= 1;
            }
            if (hidden <= 0) return shown;
            const label = `${hidden} more author${hidden === 1 ? "" : "s"}`;
            return `${shown}, and <span class="more-authors" role="button" tabindex="0"
              data-full="${attr(full)}" title="click to view all authors">${label}</span>`;
          }

          function pubHTML(p) {
            return `
              <li class="pub">
                <div class="pub-venue"><span class="tag">${esc(p.venue)}</span></div>
                <div>
                  <p class="pub-title">${p.url ? `<a href="${p.url}">${esc(p.title)}</a>` : esc(p.title)}</p>
                  <p class="pub-authors">${authorHTML(p.authors)}</p>
                  ${
                    p.periodical && p.periodical.replace(/\s+/g, " ").trim().toLowerCase() !== `${p.venue} ${p.year}`.toLowerCase()
                      ? `<p class="pub-periodical">${esc(p.periodical)}</p>`
                      : ""
                  }
                  ${p.award ? `<span class="pub-award">&#9733; ${esc(p.award)}</span>` : ""}
                  ${
                    p.links && p.links.length
                      ? `<span class="pub-links">${p.links
                          .map((l) => `<a href="${l.url}" rel="noopener" target="_blank">${esc(l.label)}</a>`)
                          .join("")}</span>`
                      : ""
                  }
                </div>
              </li>`;
          }

          function draw() {
            const rows = active === "All" ? all : all.filter((p) => p.venue === active);
            const years = [...new Set(rows.map((p) => p.year))].sort((a, b) => b - a);
            list.innerHTML = years
              .map(
                (y) => `
              <li class="pub-group">
                <h2 class="pub-year-head">${y}</h2>
                <ul class="pub-group-list">
                  ${rows.filter((p) => p.year === y).map(pubHTML).join("")}
                </ul>
              </li>`
              )
              .join("");
            document.getElementById("count").textContent =
              rows.length + (rows.length === 1 ? " paper" : " papers");
          }

          function expandAuthors(el) {
            const p = el.closest(".pub-authors");
            if (p) p.innerHTML = el.dataset.full;
          }
          list.addEventListener("click", (e) => {
            const el = e.target.closest(".more-authors");
            if (el) expandAuthors(el);
          });
          list.addEventListener("keydown", (e) => {
            if (e.key !== "Enter" && e.key !== " ") return;
            const el = e.target.closest(".more-authors");
            if (el) { e.preventDefault(); expandAuthors(el); }
          });

          filters.innerHTML = venues
            .map((v) => `<button class="pill" data-v="${v}" aria-pressed="${v === active}">${v}</button>`)
            .join("");
          filters.addEventListener("click", (e) => {
            const b = e.target.closest("button[data-v]");
            if (!b) return;
            active = b.dataset.v;
            filters.querySelectorAll("button").forEach((x) => {
              const on = x.dataset.v === active;
              x.setAttribute("aria-pressed", on);
              x.classList.toggle("pill--solid", on);
            });
            draw();
          });
          filters.querySelector('[data-v="All"]').classList.add("pill--solid");
          draw();
        });
    </script>
  </body>
</html>
